{% extends 'base_auth.html' %}

{% block title %}Đăng Nhập - Emmay Beauty Nail Salon{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <!-- Thành phần 1: Image - Hình ảnh giới thiệu thương hiệu bên trái (Chỉ trang trí) -->
  <div class="auth-left-panel" aria-hidden="true">
    <img src="/static/images/login-left-figma.png" alt="Emmay Beauty Visual" class="auth-left-img">
  </div>

  <!-- Khu vực đăng nhập bên phải -->
  <div class="auth-right-panel">
    <div class="auth-form-container">
      
      <!-- Thành phần 2: Image - Logo và tên thương hiệu Emmay Beauty -->
      <div class="auth-logo-header">
        <img src="/static/images/figma-logo-header.png" alt="Emmay Beauty" class="auth-logo-img">
      </div>

      <!-- Khung thông báo lỗi (Trạng thái 1.2, 1.3, 1.4 theo đúng Figma) -->
      {% if messages %}
        {% for message in messages %}
          <div class="auth-alert-figma" role="alert">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      <form method="post" action="{% url 'accounts:login' %}" autocomplete="on" novalidate>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <!-- Thành phần 3: Input Text - Tên tài khoản -->
        <div class="auth-input-group">
          <label for="id_username" class="auth-label">Tên tài khoản</label>
          <div class="input-with-icon">
            <span class="input-icon-left" aria-hidden="true">
              <!-- Icon User nét mảnh Figma -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A8E93" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input type="text" name="username" id="id_username" class="auth-control" placeholder="Nhập tên tài khoản" value="{{ request.POST.username|default:'' }}" autocomplete="username" required>
          </div>
        </div>

        <!-- Thành phần 4: Password Input - Mật khẩu -->
        <div class="auth-input-group">
          <label for="id_password" class="auth-label">Mật khẩu</label>
          <div class="input-with-icon">
            <span class="input-icon-left" aria-hidden="true">
              <!-- Icon Lock nét mảnh Figma -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A8E93" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="password" name="password" id="id_password" class="auth-control" placeholder="Nhập mật khẩu" autocomplete="current-password" required>
          </div>
        </div>

        <!-- Thành phần 5: Button - Đăng nhập -->
        <button type="submit" class="auth-submit-btn">
          Đăng nhập
        </button>
      </form>

      <!-- Thành phần 6: Text - hoặc (có hai đường kẻ ngang hai bên) -->
      <div class="auth-divider">
        <span>hoặc</span>
      </div>

      <!-- Thành phần 7, 8, 9: Text Chưa có tài khoản? + Link Đăng ký ngay + Link Về Trang Chủ -->
      <div class="auth-footer">
        <span class="auth-footer-text">Chưa có tài khoản?</span>
        <a href="{% url 'accounts:register' %}" class="auth-link-register">Đăng ký ngay</a>
        <span class="auth-footer-sep">|</span>
        <a href="{% url 'home' %}" class="auth-link-home">Về Trang Chủ</a>
      </div>

    </div>
  </div>
</div>
{% endblock %}
