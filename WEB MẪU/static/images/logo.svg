<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&amp;family=Montserrat:wght@400;500;600&amp;display=swap');
      .emblem { stroke: #C97F8E; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .brand-title { font-family: 'Playfair Display', serif; font-size: 26px; fill: #A85C69; font-weight: 500; letter-spacing: 0.5px; }
      .brand-sub { font-family: 'Montserrat', sans-serif; font-size: 7.5px; fill: #8F727A; letter-spacing: 3px; font-weight: 500; }
    </style>
  </defs>
  <!-- Petal / Flower Emblem -->
  <g transform="translate(142, 6)">
    <path class="emblem" d="M18,22 C12,12 6,4 18,2 C28,1 30,12 18,22 Z" />
    <path class="emblem" d="M18,22 C26,16 34,14 36,2 C32,2 24,10 18,22 Z" />
    <path class="emblem" d="M18,22 C14,18 4,18 2,12 C4,8 12,14 18,22 Z" />
    <!-- Center delicate sparkle -->
    <path d="M18,24 L18.5,25.5 L20,26 L18.5,26.5 L18,28 L17.5,26.5 L16,26 L17.5,25.5 Z" fill="#D98F9F" />
  </g>
  <!-- Text -->
  <text x="160" y="60" text-anchor="middle" class="brand-title">Emmay Beauty</text>
  <text x="160" y="76" text-anchor="middle" class="brand-sub">NAIL CARE • BEAUTY • MORE THAN A LOOK</text>
</svg>
