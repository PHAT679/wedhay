<!-- THANH TIÊU ĐỀ GỌN & SUBTABS PHÂN HỆ CƠ SỞ VẬT CHẤT -->
<div class="module-header-compact">
    <h1 class="page-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <span>Cơ sở vật chất</span>
    </h1>
</div>

<!-- SUBTABS ĐIỀU HƯỚNG GỌN – KHÔNG ĐÁNH SỐ 1, 2, 3 -->
<nav class="module-subtabs" role="tablist" aria-label="Phân hệ Cơ sở vật chất">
    <a href="{{ url_for('facilities.index') }}" 
       role="tab" 
       aria-selected="{{ 'true' if active_tab == 'requests' else 'false' }}"
       class="module-subtab-link {% if active_tab == 'requests' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        <span>Yêu cầu đăng ký</span>
        {% if total_reqs is defined and total_reqs > 0 %}
        <span class="subtab-count">{{ total_reqs }}</span>
        {% endif %}
    </a>

    <a href="{{ url_for('facilities.schedule') }}" 
       role="tab" 
       aria-selected="{{ 'true' if active_tab == 'schedule' else 'false' }}"
       class="module-subtab-link {% if active_tab == 'schedule' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><polyline points="8 12 12 16 16 12"></polyline><line x1="12" y1="8" x2="12" y2="16"></line></svg>
        <span>Lịch sử dụng</span>
        {% if total_events is defined and total_events > 0 %}
        <span class="subtab-count">{{ total_events }}</span>
        {% endif %}
    </a>

    <a href="{{ url_for('facilities.catalog') }}" 
       role="tab" 
       aria-selected="{{ 'true' if active_tab == 'catalog' else 'false' }}"
       class="module-subtab-link {% if active_tab == 'catalog' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Phòng & thiết bị</span>
    </a>
</nav>
